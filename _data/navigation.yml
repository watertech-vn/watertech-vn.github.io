#
# Menu điều hướng, theo ngôn ngữ (khóa khớp với `languages` trong _config.yml).
# Work based on https://github.com/mmistakes/minimal-mistakes/blob/master/_data/ui-text.yml
#
# `section` phải khớp với `section` tương ứng trong _data/sitetext.yml.
# Nút chuyển ngôn ngữ được thêm tự động vào cuối menu.

# Tiếng Việt (mặc định)
# ---------------------
vi:
  nav:
    - title: "Lĩnh vực"
      section: services
    - title: "Dự án"
      section: portfolio
    - title: "Giới thiệu"
      section: about
    - title: "Chặng đường"
      section: timeline
    - title: "Chuyên gia"
      section: team
    - title: "Liên hệ"
      section: contact

