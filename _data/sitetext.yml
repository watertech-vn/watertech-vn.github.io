# English
# -------
en:
  language:
    name: "English"
    short: "EN"

  meta:
    title: "INSTITUTE OF WATER RESOURCES AND ENVIRONMENTAL TECHNOLOGY"
    description: "Research and technology development institute for water resources, environment, GIS/WebGIS, IoT monitoring and decision support systems."

  header:
    title: ""
    text: Smart solutions for a sustainable future
    button: Learn more
    buttonlink: "#services"

  services:
    title: "Expertise"
    text: "Combining water resources and environmental expertise with digital technology, iWAT delivers solutions from scientific research to practical applications for government agencies, businesses and communities."
    section: services
    list:
      - title: "Water resources"
        desc: "Hydrological and hydraulic modelling; assessment and forecasting of surface water and groundwater; water resources inventory, planning and water use plans."
        icon: fas fa-water #find more at https://fontawesome.com/icons
      - title: "Flood warning & disaster risk"
        desc: "Real-time forecasting of water levels, discharge and flood warning; assessment of inundation and land subsidence; disaster risk management for river basins and cities."
        icon: fas fa-cloud-showers-heavy
      - title: "WebGIS & digital twins"
        desc: "Development of WebGIS, spatial data platforms and digital twins for river basins, cities and water infrastructure networks."
        icon: fas fa-map-marked-alt
      - title: "AI, Big Data & decision support"
        desc: "Applying artificial intelligence, big data, remote sensing and IoT; developing decision support systems (DSS) for water resources management."
        icon: fas fa-project-diagram
      - title: "Urban & industrial water supply and drainage"
        desc: "Standardizing GIS data of water supply networks and WaterGEMS hydraulic models; assessing and proposing solutions for stormwater and wastewater drainage systems."
        icon: fas fa-city
      - title: "Environment & ecosystems"
        desc: "Water quality monitoring and assessment; protection and restoration of coastal blue carbon ecosystems; nature-based solutions and rainwater reuse."
        icon: fas fa-seedling

  portfolio:
    title: "Projects"
    text: "Selected science and technology tasks, international cooperation projects and consulting contracts the Institute has carried out or is currently implementing."
    section: portfolio
    closebutton: "Close"

  timeline:
    title: "Our journey"
    text: "Milestones of the Institute of Water Resources and Environmental Technology"
    section: timeline
    # left is the default
    #start_align: "left"
    events:
      - title: "Institute founded"
        year: "2021"
        desc: "The Institute of Water Resources and Environmental Technology (iWAT) was founded to research and apply technology to water resources and environmental management."
        image: assets/img/timeline/icon-2021.svg
        alt: Year 2021
      - title: "Expanding water resources consulting"
        year: "2022"
        desc: "Partnered with Nippon Koei on groundwater surveys and data analysis; delivered the water resources and irrigation component of the Binh Duong Provincial Master Plan; monitored and forecast water resources in the Southeast region and water quality of the Dau Tieng irrigation system; research collaboration on AI models with IIT Guwahati (India)."
        image: assets/img/timeline/icon-2022.svg
        alt: Year 2022
      - title: "Developing decision support systems"
        year: "2023"
        desc: "Built 07 decision support problems and software (DSS) for the Mekong Delta Center under the WB9 project."
        image: assets/img/timeline/icon-2023.svg
        alt: Year 2023
      - title: "Building our own technology platform"
        year: "2024"
        desc: "Completed hydrodynamic and water quality modelling software integrated with a decision support system; joined the international SAGA project on the Cambodia – Vietnam transboundary aquifer with AIT."
        image: assets/img/timeline/icon-2024.svg
        alt: Year 2024
      - title: "Leading S&T tasks at all levels"
        year: "2025"
        desc: "Leading a national-level KC.09 task on blue carbon ecosystems along the South Central coast, a provincial-level task on rainwater harvesting and reuse in Ho Chi Minh City, and a NAFOSTED project on a digital twin for flood warning in the Lam River basin."
        image: assets/img/timeline/icon-2025.svg
        alt: Year 2025
      - title: "Digital transformation of the water sector"
        year: "2026"
        desc: "Completed the Ho Chi Minh City rainwater task; deployed NHABEGIS and standardized WaterGEMS data for Nha Be Water Supply; hydraulic assessment of Bien Hoa 2 Industrial Park; partnered on the FLUT urban digital twin project with TU Dresden (Germany)."
        image: assets/img/timeline/icon-2026.svg
        alt: Year 2026
