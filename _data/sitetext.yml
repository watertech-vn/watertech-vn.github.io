en: &DEFAULT_EN
  header:
    title: ""
    text: Giải pháp thông minh cho tương lai bền vững
    button: Xem thêm
    buttonlink: "#services"

  services:
    title: "Lĩnh vực"
    text: "Kết hợp chuyên môn tài nguyên nước – môi trường với công nghệ số, iWAT cung cấp giải pháp từ nghiên cứu khoa học đến ứng dụng thực tiễn cho cơ quan quản lý, doanh nghiệp và cộng đồng."
    section: services
    list:
      - title: "Tài nguyên nước"
        desc: "Mô hình hóa thủy văn – thủy lực, đánh giá và dự báo nguồn nước mặt, nước dưới đất; kiểm kê tài nguyên nước, quy hoạch và kế hoạch sử dụng nước."
        icon: fas fa-water #find more at https://fontawesome.com/icons
      - title: "Cảnh báo lũ & rủi ro thiên tai"
        desc: "Dự báo mực nước, lưu lượng và cảnh báo lũ theo thời gian thực; đánh giá ngập lụt, sụt lún và quản lý rủi ro thiên tai tại lưu vực và đô thị."
        icon: fas fa-cloud-showers-heavy
      - title: "WebGIS & bản sao số"
        desc: "Xây dựng WebGIS, nền tảng dữ liệu không gian và bản sao số (digital twin) cho lưu vực sông, đô thị và mạng lưới hạ tầng nước."
        icon: fas fa-map-marked-alt
      - title: "AI, Big Data & hỗ trợ ra quyết định"
        desc: "Ứng dụng trí tuệ nhân tạo, dữ liệu lớn, viễn thám và IoT; phát triển các hệ thống hỗ trợ ra quyết định (DSS) cho quản lý tài nguyên nước."
        icon: fas fa-project-diagram
      - title: "Kỹ thuật cấp thoát nước đô thị & khu công nghiệp"
        desc: "Chuẩn hóa dữ liệu GIS mạng lưới cấp nước, mô hình thủy lực WaterGEMS; đánh giá và đề xuất giải pháp cho hệ thống thoát nước mưa, nước thải."
        icon: fas fa-city
      - title: "Môi trường & hệ sinh thái"
        desc: "Quan trắc, đánh giá chất lượng nước; bảo vệ, phục hồi hệ sinh thái carbon xanh vùng ven biển; giải pháp dựa vào thiên nhiên, tái sử dụng nước mưa."
        icon: fas fa-seedling

  portfolio:
    title: "Dự án"
    text: "Các nhiệm vụ khoa học và công nghệ, dự án hợp tác quốc tế và hợp đồng tư vấn tiêu biểu mà Viện đã và đang thực hiện."
    section: portfolio
    closebutton: "Close Project"

  timeline:
    title: "Chặng đường phát triển"
    text: "Những dấu mốc của Viện Công nghệ Tài nguyên nước và Môi trường"
    section: timeline
    # left is the default
    #start_align: "left"
    events:
      - title: "Thành lập Viện"
        year: "2021"
        desc: "Viện Công nghệ Tài nguyên nước và Môi trường (iWAT) được thành lập, định hướng nghiên cứu và ứng dụng công nghệ trong quản lý tài nguyên nước và môi trường."
        image: assets/img/timeline/icon-2021.svg
        alt: Năm 2021
      - title: "Mở rộng tư vấn tài nguyên nước"
        year: "2022"
        desc: "Hợp tác với Nippon Koei trong khảo sát, phân tích dữ liệu nước dưới đất; thực hiện hợp phần tài nguyên nước và thủy lợi cho Quy hoạch tỉnh Bình Dương; giám sát dự báo nguồn nước lưu vực Đông Nam Bộ và chất lượng nước Hệ thống thủy lợi Dầu Tiếng; hợp tác nghiên cứu mô hình AI với IIT Guwahati (Ấn Độ)."
        image: assets/img/timeline/icon-2022.svg
        alt: Năm 2022
      - title: "Phát triển hệ thống hỗ trợ ra quyết định"
        year: "2023"
        desc: "Xây dựng 07 bài toán và phần mềm hỗ trợ ra quyết định (DSS) cho Trung tâm Đồng bằng sông Cửu Long thuộc dự án WB9."
        image: assets/img/timeline/icon-2023.svg
        alt: Năm 2023
      - title: "Xây dựng nền tảng công nghệ riêng"
        year: "2024"
        desc: "Hoàn thiện phần mềm tính toán thủy động lực, chất lượng nước tích hợp hệ thống hỗ trợ ra quyết định; tham gia dự án quốc tế SAGA về tầng chứa nước xuyên biên giới Campuchia – Việt Nam cùng AIT."
        image: assets/img/timeline/icon-2024.svg
        alt: Năm 2024
      - title: "Chủ trì nhiệm vụ KH&CN các cấp"
        year: "2025"
        desc: "Chủ trì nhiệm vụ cấp quốc gia KC.09 về hệ sinh thái carbon xanh vùng bờ Nam Trung Bộ, nhiệm vụ cấp tỉnh về thu gom, tái sử dụng nước mưa tại TP.HCM và đề tài NAFOSTED về bản sao số cảnh báo lũ lưu vực sông Lam."
        image: assets/img/timeline/icon-2025.svg
        alt: Năm 2025
      - title: "Chuyển đổi số ngành nước"
        year: "2026"
        desc: "Nghiệm thu nhiệm vụ nước mưa TP.HCM; triển khai NHABEGIS và chuẩn hóa dữ liệu WaterGEMS cho Cấp nước Nhà Bè; đánh giá thủy lực KCN Biên Hòa 2; phối hợp dự án FLUT về bản sao số đô thị cùng TU Dresden (Đức)."
        image: assets/img/timeline/icon-2026.svg
        alt: Năm 2026
    end: "Cùng <br> kiến tạo <br> tương lai"

  about:
    title: "Về chúng tôi"
    text: "Viện Công nghệ Tài nguyên nước và Môi trường (iWAT)"
    body: |
      Thành lập năm 2021, **Viện Công nghệ Tài nguyên nước và Môi trường (iWAT)** là tổ chức khoa học và công nghệ hoạt động trong lĩnh vực nghiên cứu, ứng dụng và chuyển giao công nghệ về tài nguyên nước và môi trường. Viện tập trung vào mô hình hóa thủy văn – thủy lực, WebGIS, bản sao số, trí tuệ nhân tạo và hệ thống hỗ trợ ra quyết định, hướng tới quản lý tài nguyên nước bền vững và thích ứng với biến đổi khí hậu.

      Viện chủ trì và thực hiện các nhiệm vụ khoa học và công nghệ cấp quốc gia, cấp tỉnh và đề tài do Quỹ NAFOSTED tài trợ; đồng thời tư vấn cho doanh nghiệp cấp nước, khu công nghiệp và các tổ chức quốc tế như Nippon Koei. Viện hợp tác nghiên cứu với Asian Institute of Technology (AIT), Trường Đại học Kỹ thuật Dresden (Đức) và Indian Institute of Technology Guwahati (Ấn Độ).
    section: about

