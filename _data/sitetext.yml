  about:
    title: "About us"
    text: "Institute of Water Resources and Environmental Technology (iWAT)"
    body: |
      Founded in 2021, the **Institute of Water Resources and Environmental Technology (iWAT)** is a science and technology organization working in research, application and technology transfer for water resources and the environment. The Institute focuses on hydrological and hydraulic modelling, WebGIS, digital twins, artificial intelligence and decision support systems, aiming at sustainable water resources management and climate change adaptation.

      The Institute leads and implements national-level and provincial-level science and technology tasks as well as projects funded by NAFOSTED, while providing consulting services to water supply companies, industrial parks and international organizations such as Nippon Koei. The Institute collaborates in research with the Asian Institute of Technology (AIT), Technische Universität Dresden (Germany) and the Indian Institute of Technology Guwahati (India).
    section: about

