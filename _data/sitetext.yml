vi:
  language:
    name: "Tiếng Việt"
    short: "VI"

  meta:
    title: "VIỆN CÔNG NGHỆ TÀI NGUYÊN NƯỚC VÀ MÔI TRƯỜNG"
    description: "Viện nghiên cứu và phát triển công nghệ về tài nguyên nước, môi trường, GIS/WebGIS, IoT quan trắc và hệ thống hỗ trợ ra quyết định."

  header:
    title: ""
    text: Giải pháp thông minh cho tương lai bền vững
    button: Xem thêm
    buttonlink: "#services"

  services:
    title: "Lĩnh vực"
    text: "Kết hợp chuyên môn tài nguyên nước – môi trường với công nghệ số, iWAT cung cấp giải pháp từ nghiên cứu khoa học đến ứng dụng thực tiễn cho cơ quan quản lý, doanh nghiệp và cộng đồng."
    section: services
    list:
      - title: "Tài nguyên nước"
        desc: "Mô hình hóa thủy văn – thủy lực, đánh giá và dự báo nguồn nước mặt, nước dưới đất; kiểm kê tài nguyên nước, quy hoạch và kế hoạch sử dụng nước."
        icon: fas fa-water #find more at https://fontawesome.com/icons
      - title: "Cảnh báo lũ & rủi ro thiên tai"
        desc: "Dự báo mực nước, lưu lượng và cảnh báo lũ theo thời gian thực; đánh giá ngập lụt, sụt lún và quản lý rủi ro thiên tai tại lưu vực và đô thị."
        icon: fas fa-cloud-showers-heavy
      - title: "WebGIS & bản sao số"
        desc: "Xây dựng WebGIS, nền tảng dữ liệu không gian và bản sao số (digital twin) cho lưu vực sông, đô thị và mạng lưới hạ tầng nước."
        icon: fas fa-map-marked-alt
      - title: "AI, Big Data & hỗ trợ ra quyết định"
        desc: "Ứng dụng trí tuệ nhân tạo, dữ liệu lớn, viễn thám và IoT; phát triển các hệ thống hỗ trợ ra quyết định (DSS) cho quản lý tài nguyên nước."
        icon: fas fa-project-diagram
      - title: "Kỹ thuật cấp thoát nước đô thị & khu công nghiệp"
        desc: "Chuẩn hóa dữ liệu GIS mạng lưới cấp nước, mô hình thủy lực WaterGEMS; đánh giá và đề xuất giải pháp cho hệ thống thoát nước mưa, nước thải."
        icon: fas fa-city
      - title: "Môi trường & hệ sinh thái"
        desc: "Quan trắc, đánh giá chất lượng nước; bảo vệ, phục hồi hệ sinh thái carbon xanh vùng ven biển; giải pháp dựa vào thiên nhiên, tái sử dụng nước mưa."
        icon: fas fa-seedling

  portfolio:
    title: "Dự án"
    text: "Các nhiệm vụ khoa học và công nghệ, dự án hợp tác quốc tế và hợp đồng tư vấn tiêu biểu mà Viện đã và đang thực hiện."
